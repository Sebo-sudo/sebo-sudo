name: Generate contribution snake

on:
  # run automatically every day at 00:00 UTC
  schedule:
    - cron: "0 0 * * *"

  # allow running it manually from the Actions tab
  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      # Build the snake animations into dist/.
      # color_dots takes exactly 5 colors: 0 contributions -> highest.
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#8B5CF6&color_dots=#ebedf0,#d8c7fd,#a78bfa,#8B5CF6,#00F0FF
            dist/snake-dark.svg?color_snake=#00F0FF&color_dots=#161b22,#3b1e5a,#8B5CF6,#FF00E4,#00F0FF

      # Publish dist/ to the `output` branch, where the README reads it from:
      # https://raw.githubusercontent.com/Sebo-sudo/sebo-sudo/output/snake.svg
      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
